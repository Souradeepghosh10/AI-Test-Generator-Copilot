<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products | Demo Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="products">
  <header class="site-header"></header>
  <main class="page">
    <h1>Products</h1>
    <p id="welcome"></p>
    <div class="toolbar">
      <div class="field">
        <label for="search">Search products</label>
        <input id="search" type="search" placeholder="Search by name">
      </div>
      <div class="field">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="name">Name (A-Z)</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </div>
    </div>
    <p id="result-count" class="status" role="status"></p>
    <ul id="product-list" class="products" aria-label="Products"></ul>
    <p id="cart-status" class="success" role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
