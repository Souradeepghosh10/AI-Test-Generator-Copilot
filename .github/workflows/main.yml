# Runs the Playwright tests in web-tests/ on every pull request, and after merging to main

name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "web-tests/**"
      - "demo-app/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:             # also allows running it manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web-tests

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --pass-with-no-tests

      - name: Upload HTML report
        if: always()             # upload the report even when tests fail
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web-tests/playwright-report/
          retention-days: 14
